name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # cache: npm намеренно не включён: без package-lock.json шаг падает,
          # а лок-файл в библиотеке не коммитим.

      - run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Smoke test against the built package
        run: node test/smoke.mjs

  onchain:
    # Сверка с мейннетом. Отдельной работой и без блокировки: недоступная нода
    # не должна красить сборку, но расхождение адресов надо видеть сразу.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify addresses against Robinhood Chain
        run: node test/onchain.mjs
